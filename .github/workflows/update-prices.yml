name: Update TV prices and stock

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check without changing the spreadsheet
        type: boolean
        default: true
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Malta"

permissions:
  contents: read

concurrency:
  group: tv-price-stock-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check retailers and update Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ vars.SPREADSHEET_ID }}
          SHEET_NAME: ${{ vars.SHEET_NAME }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          BREVO_SMTP_USER: ${{ secrets.BREVO_SMTP_USER }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: 465
          SMTP_SECURE: true
        run: npm start
